name: RISC-V CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          wget \
          tar \
          build-essential \
          libglib2.0-dev \
          libpixman-1-dev \
          meson

    - name: Install QEMU 9.2 from source
      run: |
        source env/versions.sh
        source env/packages/qemu.sh
        install_qemu_linux
        echo "/opt/qemu/bin" >> $GITHUB_PATH

    - name: Install RISC-V Toolchain
      run: |
        source env/versions.sh
        source env/linux/paths.sh
        source env/packages/riscv.sh
        install_riscv_toolchain_linux
        echo "/opt/riscv/bin" >> $GITHUB_PATH

    - name: Run Verification
      run: |
        bash scripts/verify_container.sh