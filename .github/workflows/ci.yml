name: CI Build and Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger

jobs:
  # Native x86_64 build
  native-build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            zip \
            unzip \
            tar \
            pkg-config

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=/opt/vcpkg" >> $GITHUB_ENV

      - name: Build native
        run: |
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            ./scripts/build.sh --debug
          else
            ./scripts/build.sh
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-native-${{ matrix.build_type }}
          path: build/Testing/Temporary/

  # RISC-V cross-compilation builds
  riscv-build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        build_type: [Release, Debug]
        rvv: ['', '--rvv']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install RISC-V toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            curl \
            zip \
            unzip \
            tar \
            pkg-config \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-user

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh
          mkdir -p /opt/vcpkg/cmake
          ln -sf $PWD/cmake/riscv64-linux-gnu.cmake /opt/vcpkg/cmake/riscv64-linux-gnu.cmake
          echo "VCPKG_ROOT=/opt/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_OVERLAY_TRIPLETS=$PWD/triplets" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          riscv64-linux-gnu-gcc --version
          qemu-riscv64 --version

      - name: Build RISC-V
        run: |
          BUILD_FLAGS="--riscv ${{ matrix.rvv }}"
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --debug"
          fi
          ./scripts/build.sh $BUILD_FLAGS

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-riscv-${{ matrix.build_type }}-${{ matrix.rvv != '' && 'rvv' || 'scalar' }}
          path: build/Testing/Temporary/

  # Code quality checks
  code-quality:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck

      - name: Check formatting (if exists)
        run: |
          if [ -d "src" ] || [ -d "include" ]; then
            find src include tests examples -name '*.hpp' -o -name '*.cpp' -o -name '*.h' 2>/dev/null | \
              xargs clang-format --dry-run --Werror || true
          fi

      - name: Run cppcheck (if source exists)
        run: |
          if [ -d "src" ]; then
            cppcheck --enable=warning,style,performance,portability \
              --suppress=missingIncludeSystem \
              --error-exitcode=1 \
              -I include \
              src/ tests/ || true
          fi
