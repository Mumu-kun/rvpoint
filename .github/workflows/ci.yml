name: CI Build and Test

on:
  workflow_dispatch: # Manual trigger only
  # push:
  #   branches: [main, develop]
  # pull_request:
  #   branches: [main]

jobs:
  # Native build (x86_64 for fast sanity checks)
  native-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          cd build
          ctest --output-on-failure --verbose

  # RISC-V cross-compilation with QEMU
  riscv-qemu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        rvv: [OFF, ON]

    steps:
      - uses: actions/checkout@v3

      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            g++-riscv64-linux-gnu \
            qemu-user \
            cmake \
            ninja-build

      - name: Verify toolchain
        run: |
          riscv64-linux-gnu-gcc --version
          qemu-riscv64 --version

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/riscv64-linux-gnu.cmake \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_RVV=${{ matrix.rvv }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      - name: Test with QEMU
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-qemu-${{ matrix.build_type }}-rvv-${{ matrix.rvv }}
          path: build/Testing/Temporary/

  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck

      - name: Check formatting
        run: |
          find include tests -name '*.hpp' -o -name '*.cpp' | \
            xargs clang-format --dry-run --Werror

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            -I include \
            tests/

  # Documentation check
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Check README
        run: |
          test -f README.md || (echo "README.md missing" && exit 1)
          test -s README.md || (echo "README.md is empty" && exit 1)
